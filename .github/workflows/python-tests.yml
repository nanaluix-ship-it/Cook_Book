name: Python tests with Allure report

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (Allure CLI needs Java)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Allure CLI 2.23.0
        run: |
          # Скачиваем архив напрямую с GitHub Releases
          curl -L -o allure.zip https://github.com/allure-framework/allure2/releases/download/2.23.0/allure-2.23.0.zip
          # Проверяем, что это действительно ZIP
          unzip -t allure.zip > /dev/null || { echo "Downloaded file is not a valid ZIP"; exit 1; }
          unzip -q allure.zip
          echo "$PWD/allure-2.23.0/bin" >> $GITHUB_PATH

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with Allure results
        run: pytest --alluredir=allure-results

      - name: Generate Allure report
        run: allure generate allure-results --clean -o allure-report

      - name: Upload Allure report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
